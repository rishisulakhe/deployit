# Prometheus scrape configuration for local dev.
# App services run on the host alongside the compose stack, so targets point
# at host.docker.internal (mapped to the host gateway by `extra_hosts`).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Recording rules pre-compute commonly-queried rates so dashboard queries stay
# fast even under high cardinality.
rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: api-server
    static_configs:
      - targets: ["host.docker.internal:3001"]
        labels:
          service: api-server

  - job_name: edge-proxy
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: edge-proxy

  - job_name: orchestrator
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3002"]
        labels:
          service: orchestrator