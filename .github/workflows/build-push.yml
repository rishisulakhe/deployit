# Build + push the build-agent image to ECR on every push to main.
# The build-agent is the only service that runs as a container (ECS Fargate);
# api-server, orchestrator, edge-proxy and dashboard run locally.
#
# Auth uses IAM user access keys stored as GitHub repo secrets:
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY  (user with ECR push perms)
#
# ECR repo: builder-service (cluster: builder-cluster-rishiprasad,
# task def: builder-task, region: ap-south-2)

name: build-push

on:
  push:
    branches: [main]

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-south-2
  ECR_REPOSITORY: builder-service

jobs:
  build:
    name: Build & Push build-agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS account ID
        id: account
        run: echo "id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: "true"

      - name: Build build-agent image
        working-directory: build-agent
        run: |
          docker build \
            -t ${{ steps.account.outputs.id }}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${{ github.sha }} \
            -t ${{ steps.account.outputs.id }}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:latest \
            .

      - name: Push build-agent image
        run: |
          docker push ${{ steps.account.outputs.id }}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${{ github.sha }}
          docker push ${{ steps.account.outputs.id }}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:latest
