# Terraform CI: format check + validate on every PR, plan on PRs (comment),
# and apply on merge to main. Uses AWS OIDC for keyless auth.
#
# Required GitHub secrets / variables:
#   AWS_ROLE_TO_ASSUME  — IAM role ARN with Terraform permissions (OIDC trust)
#   TF_STATE_BUCKET     — S3 bucket for state (already bootstrapped, see infra/terraform/README.md)
#   TF_STATE_LOCK_TABLE — DynamoDB lock table
#
# To enable OIDC: Settings → Actions → General → add identity provider
# `https://token.actions.githubusercontent.com` and create an IAM role with
# the trust policy matching `repo:your-org/vercel:*`.

name: terraform

on:
  pull_request:
    paths:
      - "infra/terraform/**"
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  fmt-validate:
    name: Format + Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"

      - name: terraform fmt
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: terraform init (no backend)
        working-directory: infra/terraform
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: infra/terraform
        run: terraform validate

  plan:
    name: Plan (PR only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: fmt-validate
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-south-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"

      - name: terraform init
        working-directory: infra/terraform
        env:
          TF_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK: ${{ secrets.TF_STATE_LOCK_TABLE }}
        run: |
          sed -i "s/vercel-clone-tfstate/${TF_BUCKET}/" backend.tf
          sed -i "s/vercel-clone-tfstate-lock/${TF_LOCK}/" backend.tf
          terraform init -input=false

      - name: terraform plan
        working-directory: infra/terraform
        id: plan
        run: |
          terraform plan -no-color -out=tfplan 2>&1 | tee plan_output.txt
          echo "exit_code=${{ job.status }}" >> $GITHUB_OUTPUT

      - name: Post plan to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/terraform/plan_output.txt', 'utf8');
            const body = `<details><summary>Terraform Plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n</details>`;
            github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body,
            });

  apply:
    name: Apply (main only)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: fmt-validate
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-south-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"

      - name: terraform init
        working-directory: infra/terraform
        env:
          TF_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK: ${{ secrets.TF_STATE_LOCK_TABLE }}
        run: |
          sed -i "s/vercel-clone-tfstate/${TF_BUCKET}/" backend.tf
          sed -i "s/vercel-clone-tfstate-lock/${TF_LOCK}/" backend.tf
          terraform init -input=false

      - name: terraform apply
        working-directory: infra/terraform
        run: terraform apply -auto-approve -input=false